<!doctype html>
<html lang="uk">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Управління задачами та проектами" />
    <title>OmniPlan</title>
    <script>
      // Apply the saved theme before first paint (mirrors applyTheme in useAppStore).
      try {
        var t = localStorage.getItem('omniplan-theme');
        var r = document.documentElement;
        if (t === 'dark' || t === 'claude-dark') r.classList.add('dark');
        if (t === 'claude' || t === 'claude-dark') r.dataset.palette = 'claude';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
